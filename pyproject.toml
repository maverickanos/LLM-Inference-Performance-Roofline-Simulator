[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-roofline"
version = "0.1.0"
description = "First-principles analytical performance model of LLM inference on NVIDIA datacenter GPUs: rooflines, prefill/decode latency, KV-cache limits, tensor-parallel scaling."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Azra Bano" }]
keywords = ["llm", "inference", "roofline", "performance-model", "gpu", "kv-cache", "tensor-parallelism"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Developers",
]
dependencies = ["numpy>=1.24", "matplotlib>=3.7"]

[project.urls]
Homepage = "https://github.com/azrabano23/llm-roofline"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["llm_roofline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
